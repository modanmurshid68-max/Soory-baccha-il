<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sorry Baby 🥺</title>
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=Mukta:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1535;--card:#3b1e49;--pink:#ff8fab;--lilac:#c9a7ff;--text:#fff1f4;--soft:#e8cfe0}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 0%,#4a2360 0%,var(--bg) 70%);color:var(--text);font-family:'Mukta',sans-serif;font-size:19px;line-height:1.7;display:flex;align-items:center;justify-content:center;padding:20px;overflow-x:hidden}
.card{background:var(--card);border:1px solid rgba(255,143,171,.25);border-radius:28px;padding:34px 28px;max-width:520px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);position:relative;z-index:2}
h1{font-family:'Kalam',cursive;font-size:clamp(2.4rem,9vw,3.4rem);line-height:1.15;margin:0 0 14px;color:var(--pink)}
h2{font-family:'Kalam',cursive;font-size:clamp(1.5rem,6vw,2rem);line-height:1.4;margin:0 0 22px}
p{margin:0 0 14px;color:var(--soft)}
.btns{display:flex;gap:16px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:84px;margin-top:10px}
button{font-family:'Kalam',cursive;font-size:1.25rem;border:0;border-radius:999px;padding:12px 34px;cursor:pointer;transition:transform .15s}
button:focus-visible{outline:3px solid var(--lilac);outline-offset:3px}
.yes{background:var(--pink);color:#3b1030;font-weight:700}
.yes:hover{transform:scale(1.06)}
.no{background:#5a3a6b;color:var(--text);z-index:5;transition:left .25s ease,top .25s ease}
.hint{min-height:1.7em;font-size:.95rem;color:var(--lilac);margin-top:12px}
.dots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}
.dots i{width:10px;height:10px;border-radius:50%;background:#5a3a6b}
.dots i.on{background:var(--pink)}
.promise{text-align:left;background:rgba(255,143,171,.1);border-radius:18px;padding:16px 20px;margin:18px 0}
.promise p{margin:6px 0;color:var(--text)}
.chat{display:flex;flex-direction:column;gap:8px;text-align:left;max-height:48vh;overflow-y:auto;padding:4px 2px;margin:6px 0 4px}
.b{max-width:80%;padding:9px 15px;border-radius:20px;font-size:1rem;line-height:1.45;animation:pop .25s ease}
.b.me{align-self:flex-end;background:#8e44e8;color:#fff;border-bottom-right-radius:6px}
.b.her{align-self:flex-start;background:#4d2a5e;color:var(--text);border-bottom-left-radius:6px}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
.sub{font-size:.9rem;color:var(--lilac)}
.heart{position:fixed;bottom:-40px;font-size:24px;opacity:.7;animation:up linear forwards;pointer-events:none;z-index:1}
@keyframes up{to{transform:translateY(-110vh) rotate(30deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.heart{display:none}.no{transition:none}}
</style>
</head>
<body>
<main class="card" id="app"></main>

<script>
// Change this to her name or nickname
const NAME = "Baby";

const questions = [
  "Do you still love me, even a little? 🥺",
  "Can I get one more chance?",
  "Will you forgive me?"
];
const dodgeLines = [
  "Don't even try pressing 'No' 😤",
  "This button is on vacation today 😌",
  "Catch me if you can! 😜",
  "The No option is closed right now 🙈",
  "'Yes' is right there, look 🥹",
  "So angry? I already said sorry 😭"
];

const app = document.getElementById('app');
let step = -1, tries = 0;

function intro(){
  app.innerHTML = `
    <h1>Sorry ${NAME} 🥺</h1>
    <p>I know you're angry with me, and I understand your feelings. I never wanted to hurt you, and I take full responsibility for what happened.</p>
    <p><b style="color:var(--text)">Please don't end our relationship.</b><br>Give me one more chance. I promise it won't happen again.</p>
    <p>Shall we play a tiny quiz?</p>
    <div class="btns"><button class="yes" id="start">Let's go 💗</button></div>`;
  document.getElementById('start').onclick = () => { step = 0; question(); };
}

function question(){
  tries = 0;
  const dots = questions.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join('');
  app.innerHTML = `
    <div class="dots">${dots}</div>
    <h2>${questions[step]}</h2>
    <div class="btns">
      <button class="yes" id="yes">Yes 💗</button>
      <button class="no" id="no">No</button>
    </div>
    <div class="hint" id="hint"></div>`;
  const yes = document.getElementById('yes'), no = document.getElementById('no');
  yes.onclick = () => { step++; step < questions.length ? question() : chats(); };

  const dodge = (e) => {
    if (e) { e.preventDefault(); e.stopPropagation(); }
    tries++;
    const pad = 12, w = no.offsetWidth, h = no.offsetHeight;
    no.style.position = 'fixed';
    no.style.left = (pad + Math.random() * (window.innerWidth - w - pad * 2)) + 'px';
    no.style.top  = (pad + Math.random() * (window.innerHeight - h - pad * 2)) + 'px';
    yes.style.transform = `scale(${Math.min(1 + tries * 0.08, 1.6)})`;
    document.getElementById('hint').textContent = dodgeLines[(tries - 1) % dodgeLines.length];
  };
  no.addEventListener('pointerenter', dodge);
  no.addEventListener('pointerdown', dodge);
  no.addEventListener('touchstart', dodge, { passive: false });
  no.addEventListener('click', dodge);
  no.addEventListener('focus', () => { no.blur(); dodge(); });
  no.addEventListener('keydown', dodge);
}

const chatLines = [["me", "28 ko ana ki kosis karta hu"], ["her", "Acha"], ["her", "28 ko mere frnd log ke sath bahr jane ka plan hai aur sham possible nhi hai"], ["me", "baccha apki clg ka pas"], ["her", "Kya"], ["me", "baccha subha ma baat kiya na"], ["her", "Kab???"], ["me", "baccha dufar ma"], ["her", "Acha"], ["me", "ap ya bhi bola ap bhi chalna shath ma gumna"], ["me", "Ha"], ["her", "Oh"], ["her", "Ha"], ["her", "Yaad aya"], ["her", "Toh aa rahe ho???"], ["me", "try karuga baccha"], ["her", "Acha"], ["me", "Ha"], ["me", "agar mera manager gau sha ajaiga to ma ajau ga"], ["her", "Kya"], ["me", "manager gau ma ha"], ["her", "Acha"], ["me", "dukhan ma humlog do log hi ha samal na wala"], ["me", "Ha"], ["her", "Acha"], ["her", "Kis cheez ki dhukan hai"], ["me", "cloth ki baccha"], ["me", "baccha log ki"], ["her", "Acha"], ["me", "Ha"], ["her", "Hmm"], ["me", "Or bolo baccha"], ["me", "Paat baccha"], ["her", "Acha"], ["me", "Ha"], ["me", "apko baat karna ka Dil ha na ap baat karo na baccha"], ["me", "meko habit kaam pa jane ki"], ["her", "Mhuje bhi nind aa rahi hai"], ["me", "ek kaam karo"], ["her", "Haa"], ["me", "ap aisa baat kiya karo apko bhi accha laga"], ["her", "Acha"], ["me", "rest karo baccha"], ["her", "Wahi toh kar rahe ho"], ["me", "neend acchi ro"], ["her", "Haa"], ["me", "dark chocolate kha sakte ho"], ["her", "Haa"], ["me", "ok Baby"], ["me", "neend a rai ha apko"], ["her", "Haa"], ["me", "ap sohjau fir baccha"], ["her", "Haa"], ["her", "Tum bhi"], ["me", "phone mat chalana baccha"], ["her", "Haa"], ["me", "Ok baccha"], ["her", "Byyy"], ["me", "Byy ❤️"], ["her", "Gn 😴"], ["me", "Allah hafiz"], ["me", "Good night ❤️"], ["me", "voice note nhi bheja baccha"], ["me", "i love you baccha ❤️"], ["her", "Abhi"], ["her", "Love you too"], ["her", "😘🤧"], ["me", "Kal ap bola tha kal sha bheju gi voice note"], ["her", "Ha but abhi sab so rahe hai yrr"], ["me", "good morning good night dono ki voice note"], ["me", "shiro sha bola baccha"], ["me", "Kya baat kar ra baccha"], ["me", "Ok baccha sohjau"]];

function chats(){
  app.innerHTML = `
    <h2>Our Chats 💬</h2>
    <p class="sub">A few moments I really love</p>
    <div class="chat" id="chat"></div>
    <div class="btns" style="min-height:70px"><button class="yes" id="nx">Next 💗</button></div>`;
  const box = document.getElementById('chat'), nx = document.getElementById('nx');
  let i = 0;
  const add = () => {
    for (let k = 0; k < 4 && i < chatLines.length; k++, i++) {
      const d = document.createElement('div');
      d.className = 'b ' + chatLines[i][0];
      d.textContent = chatLines[i][1];
      box.appendChild(d);
    }
    box.scrollTop = box.scrollHeight;
    if (i >= chatLines.length) nx.textContent = 'Continue 💗';
  };
  add();
  nx.onclick = () => { i < chatLines.length ? add() : finish(); };
}

function finish(){
  hearts(40);
  app.innerHTML = `
    <h1>Thank you ${NAME} 🥹💗</h1>
    <p>I knew you have a big heart.</p>
    <div class="promise">
      <p>💗 This won't happen again.</p>
      <p>💗 If something hurts you, I'll listen first, not argue.</p>
      <p>💗 You mean the world to me.</p>
    </div>
    <p>Please send me a message now, I'm waiting 🥺</p>`;
}

function hearts(n){
  for (let i = 0; i < n; i++) {
    const h = document.createElement('div');
    h.className = 'heart';
    h.textContent = ['💗','💖','💕','🌸'][i % 4];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.animationDuration = (4 + Math.random() * 4) + 's';
    h.style.animationDelay = (Math.random() * 2) + 's';
    document.body.appendChild(h);
    setTimeout(() => h.remove(), 10000);
  }
}

intro();
</script>
</body>
</html>
